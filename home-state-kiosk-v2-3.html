<title>Home State example house</title>
<style>
:root{
  --viewport:#14181B; --panel:#1B2024; --panel-2:#22282D; --rule:#2E363C;
  --ink:#E7ECEF; --ink-2:#A7B2B9; --muted:#79858D;
  --pt-face:#3B87DE; --pt-edge:#E29033; --pt-pen:#3AA765; --pt-elev:#DC4E4E; --pt-skip:#69757C;
  --st-stable:#3AA765; --st-monitor:#D9A821; --st-elevated:#E0662B; --st-fir:#DC4E4E; --sensor:#9B72E8;
  --air:#3FC1D4; --emf:#D46FC4;
  --focus:#3B87DE;
  --grid:#232A30; --wallfill:rgba(190,205,215,.10); --wallline:#55636C;
  --floorfill:rgba(59,135,222,.07); --ceilfill:rgba(226,144,51,.05);
}
:root:not([data-theme="dark"]){
  --viewport:#DFE4E7; --panel:#F1F4F5; --panel-2:#E5EAEC; --rule:#C6CFD4;
  --ink:#171C20; --ink-2:#48545C; --muted:#6C7981;
  --pt-face:#1F63B0; --pt-edge:#B96A12; --pt-pen:#1F7D45; --pt-elev:#B62F2F; --pt-skip:#8A959B;
  --st-stable:#1F7D45; --st-monitor:#9C7A0D; --st-elevated:#BC4E14; --st-fir:#B62F2F; --sensor:#6B46C1;
  --air:#0E7C8C; --emf:#A8399A;
  --grid:#CBD3D8; --wallfill:rgba(30,45,60,.08); --wallline:#7D8990;
  --floorfill:rgba(31,99,176,.09); --ceilfill:rgba(185,106,18,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --viewport:#14181B; --panel:#1B2024; --panel-2:#22282D; --rule:#2E363C;
    --ink:#E7ECEF; --ink-2:#A7B2B9; --muted:#79858D;
    --pt-face:#3B87DE; --pt-edge:#E29033; --pt-pen:#3AA765; --pt-elev:#DC4E4E; --pt-skip:#69757C;
    --st-stable:#3AA765; --st-monitor:#D9A821; --st-elevated:#E0662B; --st-fir:#DC4E4E; --sensor:#9B72E8;
    --air:#3FC1D4; --emf:#D46FC4;
    --grid:#232A30; --wallfill:rgba(190,205,215,.10); --wallline:#55636C;
    --floorfill:rgba(59,135,222,.07); --ceilfill:rgba(226,144,51,.05);
  }
}
:root[data-theme="dark"]{
  --viewport:#14181B; --panel:#1B2024; --panel-2:#22282D; --rule:#2E363C;
  --ink:#E7ECEF; --ink-2:#A7B2B9; --muted:#79858D;
  --pt-face:#3B87DE; --pt-edge:#E29033; --pt-pen:#3AA765; --pt-elev:#DC4E4E; --pt-skip:#69757C;
  --st-stable:#3AA765; --st-monitor:#D9A821; --st-elevated:#E0662B; --st-fir:#DC4E4E; --sensor:#9B72E8;
  --air:#3FC1D4; --emf:#D46FC4;

}
*{box-sizing:border-box}
body{
  margin:0; background:var(--viewport); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.5;
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}
.lbl{
  font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  text-transform:uppercase; letter-spacing:.09em; font-weight:600;
  font-size:11px; color:var(--muted);
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums}

/* ---- top bar ---- */
header{
  flex:0 0 auto; display:flex; align-items:center; gap:18px;
  padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--rule);
}
header h1{
  margin:0; font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:700;
  font-size:16px; letter-spacing:.02em; text-transform:uppercase;
}
header .sub{font-size:12px; color:var(--muted); margin-left:-10px}
header .spacer{flex:1}
button, .btn{
  font-family:"IBM Plex Sans Condensed",sans-serif; text-transform:uppercase;
  letter-spacing:.07em; font-weight:600; font-size:11px;
  background:var(--panel-2); color:var(--ink); border:1px solid var(--rule);
  padding:6px 11px; border-radius:2px; cursor:pointer;
}
button:hover{border-color:var(--muted)}
button:focus-visible, textarea:focus-visible{outline:2px solid var(--focus); outline-offset:1px}
button[aria-pressed="true"]{background:var(--ink); color:var(--panel); border-color:var(--ink)}

/* ---- main split ---- */
main{flex:1; display:grid; grid-template-columns:minmax(340px,30%) 1fr; min-height:0}
@media (max-width:860px){ main{grid-template-columns:1fr; grid-template-rows:40% 1fr} }

.editor{
  display:flex; flex-direction:column; min-height:0;
  background:var(--panel); border-right:1px solid var(--rule);
}
.editor-head{display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--rule)}
textarea{
  flex:1; width:100%; resize:none; border:0; padding:12px;
  background:transparent; color:var(--ink);
  font-family:"IBM Plex Mono",monospace; font-size:12.5px; line-height:1.7;
  tab-size:2;
}
.errors{
  flex:0 0 auto; max-height:26%; overflow:auto; border-top:1px solid var(--rule);
  padding:8px 12px; font-size:12px;
}
.errors:empty{display:none}
.err{color:var(--pt-elev); display:flex; gap:8px}
.err b{font-family:"IBM Plex Mono",monospace; font-weight:500; color:var(--muted); flex:0 0 auto}

/* ---- viewport ---- */
.stage{position:relative; min-height:0; background:var(--viewport)}
canvas{display:block; width:100%; height:100%; cursor:grab; touch-action:none}
canvas.drag{cursor:grabbing}
.rail{
  position:absolute; top:12px; left:12px; display:flex; flex-direction:column; gap:1px;
  background:var(--rule); border:1px solid var(--rule); border-radius:2px; overflow:hidden;
}
.rail button{border:0; border-radius:0; text-align:left; min-width:132px; display:flex; gap:8px; align-items:center}
.swatch{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
.hint{
  position:absolute; bottom:12px; left:12px; font-size:11px; color:var(--muted);
  background:var(--panel); border:1px solid var(--rule); padding:5px 9px; border-radius:2px;
}
.northarrow{position:absolute; top:12px; right:12px; text-align:center; color:var(--ink-2)}
.northarrow svg{display:block}

/* ---- walls view ---- */
.wallsview{position:absolute; inset:0; overflow:auto; background:var(--viewport); padding:16px; display:none}
.wallsview.on{display:block}
.wv-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; align-items:start}
.wv-room{grid-column:1/-1; margin:6px 0 -4px; font-family:"IBM Plex Sans Condensed",sans-serif;
  font-size:12px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--ink-2);
  border-bottom:1px solid var(--rule); padding-bottom:4px}
.wv-card{background:var(--panel); border:1px solid var(--rule); border-radius:2px; padding:10px 12px}
.wv-card h3{margin:0 0 2px; font-family:"IBM Plex Sans Condensed",sans-serif; font-size:13px;

.wv-card .dims{font-size:11px; color:var(--muted); margin-bottom:6px}
.wv-card svg{width:100%; height:auto; display:block}
.wv-card text{font-family:"IBM Plex Mono",monospace}
.namestd{background:var(--panel); border:1px solid var(--rule); border-radius:2px; padding:12px 14px; margin-bottom:14px}
.namestd h2{margin:0 0 8px; font-family:"IBM Plex Sans Condensed",sans-serif; font-size:14px;

.namestd .tblwrap{overflow-x:auto}
.namestd table{border-collapse:collapse; width:100%; font-size:12px}
.namestd th{text-align:left; font-family:"IBM Plex Sans Condensed",sans-serif; text-transform:uppercase;
  letter-spacing:.07em; font-size:10.5px; color:var(--muted); font-weight:600;
  padding:5px 12px 5px 0; border-bottom:1px solid var(--rule)}
.namestd td{padding:5px 12px 5px 0; border-bottom:1px solid var(--rule); vertical-align:top}
.namestd td:first-child{font-family:"IBM Plex Mono",monospace; white-space:nowrap; font-size:11.5px}
.namestd .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:baseline}

/* ---- inspector ---- */
.inspector{position:absolute; top:0; right:0; bottom:0; width:320px; max-width:85%;
  background:var(--panel); border-left:1px solid var(--rule); display:none;

.insp-body{flex:1; overflow:auto; padding:10px 12px}
.insp-body svg{width:100%; height:auto; display:block; margin-bottom:10px}
.insp-body svg text{font-family:"IBM Plex Mono",monospace}

.ptable{border-collapse:collapse; width:100%; font-size:11.5px}

.ptable tr.sel td{color:var(--pt-face); font-weight:600}
.ptable tr:hover td{color:var(--ink)}
.ptable .fam{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px}

/* ---- tally ---- */
footer{
  flex:0 0 auto; background:var(--panel); border-top:1px solid var(--rule);
  display:flex; align-items:stretch; overflow-x:auto;
}
.tally{display:flex; gap:0; align-items:stretch}
.cell{padding:8px 16px; border-right:1px solid var(--rule); min-width:96px}
.cell .n{font-family:"IBM Plex Mono",monospace; font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.15}
.cell.total .n{color:var(--pt-face)}
footer .spacer{flex:1; border-right:1px solid var(--rule)}
.exports{display:flex; gap:8px; align-items:center; padding:8px 14px}
.note{padding:8px 14px; font-size:11px; color:var(--muted); min-width:230px; max-width:420px; line-height:1.45}
</style>

<script>
"use strict";
/* ============================================================
   SETTING OUT - Joe Builds house builder
   Geometry from dictated dimensions. Point sets per Surface
   Point Reference Standard V1.2 (SCREEN pass).
   World axes: +X east, +Y up, +Z south. North = -Z.
   ============================================================ */

const DEFAULTS = { floorheight:0.45, pitch:22.5, eaves:0.60, roof:"gable", spacing:0 };
let DENSITY="screen";           // screen | standard | dense  (V1.2 density passes)
const REACH=2.1;                // metres: points at or above this need a ladder/platform

/* ---------- 1. PARSER ---------------------------------------------------- */
function parse(text){
  const rooms=[], errors=[]; let home={code:"",name:""}, opt={...DEFAULTS}, cur=null;
  const num = s => { const v=parseFloat(s); return isFinite(v)?v:null; };

  text.split(/\r?\n/).forEach((raw,i)=>{
    const ln=i+1, line=raw.replace(/#.*$/,"").trim();
    if(!line) return;
    const low=line.toLowerCase();
    const err=m=>errors.push({ln,m});

    // home CODE Name...
    let m=line.match(/^home\s+(\S+)\s*(.*)$/i);
    if(m){ home={code:m[1],name:m[2].trim()}; return; }

    // single-value settings
    m=low.match(/^(floorheight|pitch|eaves|spacing)\s+(-?[\d.]+)$/);
    if(m){ const v=num(m[2]); if(v===null) return err("not a number"); opt[m[1]]=v; return; }
    m=low.match(/^roof\s+(gable|hip|skillion|flat)$/);
    if(m){ opt.roof=m[1]; return; }

    // room CODE Name W x D x H [at X,Y]
    m=line.match(/^room\s+(\S+)\s+(.*?)\s+([\d.]+)\s*[x*]\s*([\d.]+)\s*[x*]\s*([\d.]+)\s*(?:at\s+(-?[\d.]+)\s*,\s*(-?[\d.]+))?$/i);
    if(m){
      const w=num(m[3]), d=num(m[4]), h=num(m[5]);
      if(!w||!d||!h) return err("room needs W x D x H in metres");
      cur={ code:m[1].toUpperCase(), name:m[2].trim(), w, d, h,
            x: m[6]!==undefined?num(m[6]):null, z: m[7]!==undefined?num(m[7]):null,
            openings:[], pens:[], fixtures:[], wallobs:[], extobjs:[], airtests:[], line:ln };
      rooms.push(cur); return;
    }

    // N|E|S|W  door|window  W x H  [xN]
    m=low.match(/^([nesw])\s+(door|window)\s+([\d.]+)\s*[x*]\s*([\d.]+)\s*(?:x\s*(\d+))?$/);
    if(m){
      if(!cur) return err("opening before any room");
      const w=num(m[3]), h=num(m[4]), n=m[5]?parseInt(m[5],10):1;
      if(!w||!h) return err("opening needs W x H in metres");
      for(let k=0;k<n;k++) cur.openings.push({side:m[1].toUpperCase(), kind:m[2], w, h});
      return;
    }

    // wall objects: N aircon [W x H] · N joinery|robe|mirror|obstruction W x H [at X]
    m=low.match(/^([nesw])\s+aircon\s*(?:([\d.]+)\s*[x*]\s*([\d.]+))?\s*$/);
    if(m){ if(!cur) return err("aircon before any room");
      cur.wallobs.push({side:m[1].toUpperCase(), type:"AC", w:m[2]?num(m[2]):0.8, h:m[3]?num(m[3]):0.3, mount:"high"}); return; }
    m=low.match(/^([nesw])\s+(joinery|robe|mirror|obstruction)\s+([\d.]+)\s*[x*]\s*([\d.]+)\s*(?:at\s+([\d.]+))?$/);
    if(m){ if(!cur) return err("wall object before any room");
      cur.wallobs.push({side:m[1].toUpperCase(), type:m[2].toUpperCase(), w:num(m[3]), h:num(m[4]),
        off:m[5]!==undefined?num(m[5]):null, mount:m[2]==="mirror"?"mid":"floor"}); return; }

    // smoke N|E|S|W : smoke pen air-path test at that wall's opening (or base)
    m=low.match(/^smoke\s+([nesw])$/);
    if(m){ if(!cur) return err("smoke test before any room");
      cur.airtests.push({side:m[1].toUpperCase(), type:"SMOKE"}); return; }
    // airflow N|E|S|W : vane/hot-wire cross-flow reading at that opening
    m=low.match(/^airflow\s+([nesw])$/);
    if(m){ if(!cur) return err("airflow test before any room");
      cur.airtests.push({side:m[1].toUpperCase(), type:"FLOW"}); return; }
    // emf : optional wireless/EM signal survey point, room centre
    m=low.match(/^emf$/);
    if(m){ if(!cur) return err("emf before any room"); cur.airtests.push({type:"EMF"}); return; }

    // aranet | sensor : one air logger in this room, centre, 1.2 m
    m=low.match(/^(aranet|sensor)$/);
    if(m){ if(!cur) return err("sensor before any room"); cur.sensor=true; return; }

    // external risk objects: N downpipe [at X] · N tap [at X] · stormwater N|E|S|W
    m=low.match(/^([nesw])\s+(downpipe|tap)\s*(?:at\s+([\d.]+))?$/);
    if(m){ if(!cur) return err("risk object before any room");
      cur.extobjs.push({side:m[1].toUpperCase(), type:m[2].toUpperCase(), off:m[3]!==undefined?num(m[3]):null}); return; }
    m=low.match(/^stormwater\s+([nesw])$/);
    if(m){ if(!cur) return err("stormwater before any room");
      cur.extobjs.push({side:m[1].toUpperCase(), type:"STORMWATER"}); return; }

    // fixtures: shower W x D at NE|NW|SE|SW  ·  vanity W at N|E|S|W  ·
    // toilet at N|E|S|W  ·  bath W x D at N|E|S|W
    m=low.match(/^shower\s+([\d.]+)\s*[x*]\s*([\d.]+)\s+at\s+(ne|nw|se|sw)$/);
    if(m){ if(!cur) return err("fixture before any room");
      cur.fixtures.push({type:"SHWR", w:num(m[1]), d:num(m[2]), corner:m[3].toUpperCase()}); return; }
    m=low.match(/^vanity\s+([\d.]+)\s+at\s+([nesw])$/);
    if(m){ if(!cur) return err("fixture before any room");
      cur.fixtures.push({type:"VAN", w:num(m[1]), d:0.6, side:m[2].toUpperCase()}); return; }
    m=low.match(/^toilet\s+at\s+([nesw])$/);
    if(m){ if(!cur) return err("fixture before any room");
      cur.fixtures.push({type:"WC", w:0.5, d:0.75, side:m[1].toUpperCase()}); return; }
    m=low.match(/^bath\s+([\d.]+)\s*[x*]\s*([\d.]+)\s+at\s+([nesw])$/);
    if(m){ if(!cur) return err("fixture before any room");
      cur.fixtures.push({type:"BATH", w:num(m[1]), d:num(m[2]), side:m[3].toUpperCase()}); return; }

    // ceiling|floor  fan|dl|hatch|pl|pen|fw  [xN]
    m=low.match(/^(ceiling|floor)\s+(fan|dl|hatch|pl|pen|fw)\s*(?:x\s*(\d+))?$/);
    if(m){
      if(!cur) return err("penetration before any room");
      const n=m[3]?parseInt(m[3],10):1;
      for(let k=0;k<n;k++) cur.pens.push({surface:m[1]==="ceiling"?"CEIL":"FLR", type:m[2].toUpperCase()});
      return;
    }

    err("not understood");
  });

  // auto-place rooms with no explicit position, left to right
  let cx=0;
  rooms.forEach(r=>{ if(r.x===null||r.z===null){ r.x=cx; r.z=0; cx+=r.w; } else cx=Math.max(cx,r.x+r.w); });
  return { home, opt, rooms, errors };
}

/* ---------- 2. POINT SETS (Standard V1.2, SCREEN) ------------------------ */
// Wall  : E1-E8 perimeter + FACE-LM + FACE-RM
// Floor : 2x2 field A1 B1 A2 B2 + E1-E8
// Ceil  : same as floor, projected up, never mirrored
// Opening: 8 on the reveal, clockwise from top-left
// Pen   : 4 (plan 1N 2E 3S 4W; wall face 1top 2right 3bottom 4left); fan adds FAN-F

const SIDES = [ {k:"N",wall:"W1"}, {k:"E",wall:"W2"}, {k:"S",wall:"W3"}, {k:"W",wall:"W4"} ];

// u runs left->right as you stand inside facing the wall; v runs 0 (floor) -> 1 (ceiling)
function wallFrame(r,side){
  const x0=r.x, x1=r.x+r.w, z0=r.z, z1=r.z+r.d, h=r.h;
  switch(side){
    case "N": return {o:[x1,0,z0], u:[-r.w,0,0], v:[0,h,0], len:r.w};
    case "E": return {o:[x1,0,z1], u:[0,0,-r.d], v:[0,h,0], len:r.d};
    case "S": return {o:[x0,0,z1], u:[r.w,0,0],  v:[0,h,0], len:r.w};
    case "W": return {o:[x0,0,z0], u:[0,0,r.d],  v:[0,h,0], len:r.d};
  }
}
const at=(f,a,b)=>[ f.o[0]+f.u[0]*a+f.v[0]*b, f.o[1]+f.u[1]*a+f.v[1]*b, f.o[2]+f.u[2]*a+f.v[2]*b ];

function wallPoints(r,side,spacing){
  const f=wallFrame(r,side), W=SIDES.find(s=>s.k===side).wall, P=[];
  // opening rectangles on this wall, in (a,b) space - no reading ever lands inside one:
  // glass is not measured, and door leaf material is not a survey point (controls are separate)
  const rects=r.openings.filter(o=>o.side===side).map(o=>{
    const sill=o.kind==="door"?0:0.9;
    return {a0:.5-(o.w/f.len)/2, a1:.5+(o.w/f.len)/2, b0:sill/r.h, b1:(sill+o.h)/r.h};
  });
  const inOpen=(a,b)=>rects.find(q=>a>q.a0+1e-3&&a<q.a1-1e-3&&b>q.b0-1e-3&&b<q.b1+1e-3);
  const push=(fam,ref,a,b)=>{
    const q=inOpen(a,b);
    if(!q){ P.push({id:`${r.code}-${W}-${fam}-${ref}`,fam,pos:at(f,a,b),room:r.code,surface:W,ref,a,b}); return; }
    if(fam==="FACE") return; // face point on glass or a door leaf does not exist
    // edge run interrupted by an opening: one point each side of the frame (field learning 17)
    const off=0.08/f.len;
    const aL=Math.max(0,q.a0-off), aR=Math.min(1,q.a1+off);
    P.push({id:`${r.code}-${W}-${fam}-${ref}L`,fam,pos:at(f,aL,b),room:r.code,surface:W,ref:ref+"L",a:aL,b});
    P.push({id:`${r.code}-${W}-${fam}-${ref}R`,fam,pos:at(f,aR,b),room:r.code,surface:W,ref:ref+"R",a:aR,b});
  };
  // perimeter, corner -> centre -> corner, top-left origin.
  // CORNER INSET: each wall owns its own corner readings. Without the inset two
  // adjacent walls place a point at the identical position and you see one dot at
  // a corner instead of one per wall. The reading also has to belong to a single
  // named surface, so the point is taken just inside the wall, not on the arris.
  const CORNER_INSET_M = 0.12;                       // metres in from each end
  const ci = Math.min(CORNER_INSET_M, f.len*0.08)/f.len;   // never past 8% of a short wall
  const L = ci, R = 1-ci;
  push("EDGE","E1",L,1); push("EDGE","E2",.5,1); push("EDGE","E3",R,1);
  push("EDGE","E4",R,.5); push("EDGE","E5",R,0); push("EDGE","E6",.5,0);
  push("EDGE","E7",L,0); push("EDGE","E8",L,.5);
  // optional subdivision on long walls (max midpoint spacing)
  if(spacing>0 && f.len>spacing){
    const n=Math.ceil(f.len/spacing);
    for(let i=1;i<n;i++){ const a=i/n; if(Math.abs(a-.5)<1e-6) continue;
      push("EDGE",`E-T${i}`,a,1); push("EDGE",`E-B${i}`,a,0); }
  }
  // FACE points scale with wall size:
  //   columns: one per ~1.8 m of length, min 2
  //   rows:    1 up to 2.7 m high, 2 up to 3.6 m, 3 above
  // DENSITY: screen = as above · standard = +1 column · dense = 3x3 minimum grid
  let cols=Math.max(2,Math.round(f.len/1.8)), rows=r.h<=2.7?1:r.h<=3.6?2:3;
  if(DENSITY==="standard") cols+=1;
  if(DENSITY==="dense"){ cols=Math.max(3,cols); rows=Math.max(3,rows); }
  if(rows===1 && cols===2 && DENSITY==="screen"){
    push("FACE","LM",.25,.5); push("FACE","RM",.75,.5);
  } else {
    let k=0; // reading order: top row first, left to right
    for(let ri=0;ri<rows;ri++) for(let ci=0;ci<cols;ci++){
      k++; const a=(ci+1)/(cols+1), b=1-(ri+1)/(rows+1);
      push("FACE","F"+k,a,b);
    }
  }
  return P;
}

function openingPoints(r,side,idx,op){
  const f=wallFrame(r,side), W=SIDES.find(s=>s.k===side).wall;
  const tag=(op.kind==="door"?"DOOR":"WIN")+String(idx+1).padStart(2,"0");
  // centred on the wall, doors from floor, windows with a nominal 0.9 sill
  const sill = op.kind==="door" ? 0 : 0.9;
  const a0=.5-(op.w/f.len)/2, a1=.5+(op.w/f.len)/2, b0=sill/r.h, b1=(sill+op.h)/r.h;
  const g=[[a0,b1],[.5,b1],[a1,b1],[a1,(b0+b1)/2],[a1,b0],[.5,b0],[a0,b0],[a0,(b0+b1)/2]];
  return g.map((c,i)=>({ id:`${r.code}-${W}-OPENING-${tag}-${i+1}`, fam:"OPENING",
    pos:at(f,c[0],c[1]), room:r.code, surface:W, ref:`${tag}-${i+1}` }));
}

function planPoints(r,surface){ // FLR at y=0, CEIL at y=h, same grid, never mirrored
  const y = surface==="CEIL" ? r.h : 0, P=[];
  const px=(a,b)=>[ r.x+r.w*a, y, r.z+r.d*b ];
  const push=(fam,ref,a,b)=>P.push({id:`${r.code}-${surface}-${fam}-${ref}`,fam,pos:px(a,b),room:r.code,surface,ref});
  // field grid by density: screen 2x2 · standard 3x3 · dense 4x4
  const n=DENSITY==="dense"?4:DENSITY==="standard"?3:2, L="ABCD";
  for(let ri=0;ri<n;ri++) for(let ci=0;ci<n;ci++)
    push("GRID",L[ci]+(ri+1),(ci+1)/(n+1),(ri+1)/(n+1));
  push("EDGE","E1",0,0); push("EDGE","E2",.5,0); push("EDGE","E3",1,0); push("EDGE","E4",1,.5);
  push("EDGE","E5",1,1); push("EDGE","E6",.5,1); push("EDGE","E7",0,1); push("EDGE","E8",0,.5);
  return P;
}

function penPoints(r,pen,idx){
  const y = pen.surface==="CEIL" ? r.h : 0;
  const cx=r.x+r.w*.5, cz=r.z+r.d*.5, s=.28;
  const tag=pen.type+String(idx+1).padStart(2,"0");
  const off=[[0,-s],[s,0],[0,s],[-s,0]]; // 1 north, 2 east, 3 south, 4 west
  const P=off.map((o,i)=>({ id:`${r.code}-${pen.surface}-${pen.type}-${tag}-${i+1}`, fam:"PEN",
    pos:[cx+o[0],y,cz+o[1]], room:r.code, surface:pen.surface, ref:`${tag}-${i+1}` }));
  if(pen.type==="FAN") P.push({ id:`${r.code}-${pen.surface}-FAN-${tag}-F`, fam:"PEN",
    pos:[cx,y,cz], room:r.code, surface:pen.surface, ref:`${tag}-F` });
  return P;
}

/* ---------- 2b. FIXTURES (Wet Area Overlay, V1.2 section 6) --------------- */
// Footprint rect {x,z,w,d} in world coords + which wall it backs onto.
function fixtureRect(r,fx){
  const W={x:r.x, z:r.z};
  if(fx.corner){ // shower in a corner: NE NW SE SW
    const x = fx.corner[1]==="E" ? r.x+r.w-fx.w : r.x;
    const z = fx.corner[0]==="N" ? r.z          : r.z+r.d-fx.d;
    return {x,z,w:fx.w,d:fx.d, backN:fx.corner[0]==="N", backE:fx.corner[1]==="E",
            wall: fx.corner[0]==="N" ? "W1":"W3"};
  }
  // side-mounted: centred on that wall
  switch(fx.side){
    case "N": return {x:r.x+(r.w-fx.w)/2, z:r.z,             w:fx.w, d:fx.d, wall:"W1"};
    case "S": return {x:r.x+(r.w-fx.w)/2, z:r.z+r.d-fx.d,    w:fx.w, d:fx.d, wall:"W3"};
    case "E": return {x:r.x+r.w-fx.d,     z:r.z+(r.d-fx.w)/2, w:fx.d, d:fx.w, wall:"W2"};
    case "W": return {x:r.x,              z:r.z+(r.d-fx.w)/2, w:fx.d, d:fx.w, wall:"W4"};
  }
}
function fixturePoints(r,fx,idx){
  const R=fixtureRect(r,fx), P=[], tag=fx.type+String(idx+1).padStart(2,"0");
  const F=(ref,x,y,z,fam)=>P.push({id:`${r.code}-FLR-FIX-${ref}`,fam:fam||"FIX",
    pos:[x,y,z],room:r.code,surface:"FLR",ref});
  const Won=(wall,ref,x,y,z)=>P.push({id:`${r.code}-${wall}-FIX-${ref}`,fam:"FIX",
    pos:[x,y,z],room:r.code,surface:wall,ref});
  const cx=R.x+R.w/2, cz=R.z+R.d/2;
  if(fx.type==="SHWR"){
    // waste at tray centre, 4-pt (1N 2E 3S 4W)
    const o=.12; [[0,-o,1],[o,0,2],[0,o,3],[-o,0,4]].forEach(v=>F(`${tag}-FW01-${v[2]}`,cx+v[0],0,cz+v[1]));
    // threshold L/C/R on the open edge (edge away from the backing z-wall)
    const tz = R.backN ? R.z+R.d : R.z;
    F(`${tag}-THR-L`,R.x+R.w*.1,0,tz); F(`${tag}-THR-C`,cx,0,tz); F(`${tag}-THR-R`,R.x+R.w*.9,0,tz);
    // screen junction at the open corner
    const sx = R.backE ? R.x : R.x+R.w;
    F(`${tag}-SCRN-J`,sx,0,tz);
    // mixer 4-pt at 1.1 m + rose at 1.85 m on the backing z-wall
    const wz = R.backN ? r.z : r.z+r.d, wall=R.wall, m=.09;
    [[-m,0,4],[m,0,2],[0,-m,1],[0,m,3]].forEach(v=>Won(wall,`${tag}-MIXER01-${v[2]}`,cx+v[0],1.1+v[1],wz));
    Won(wall,`${tag}-ROSE01`,cx,1.85,wz);
  }
  if(fx.type==="VAN"){
    // base junction L/R at the wall line, wall point behind at 1.0 m, waste 4-pt under bench
    const side=fx.side, wall=R.wall;
    const wx = side==="E" ? r.x+r.w : side==="W" ? r.x : null;
    const wz = side==="N" ? r.z : side==="S" ? r.z+r.d : null;
    if(wz!==null){ F(`${tag}-BASE-L`,R.x,0,wz); F(`${tag}-BASE-R`,R.x+R.w,0,wz);
      Won(wall,`${tag}-WALL-C`,cx,1.0,wz);
      const o=.1; [[0,-o,1],[o,0,2],[0,o,3],[-o,0,4]].forEach(v=>F(`${tag}-WASTE01-${v[2]}`,cx+v[0],0,cz+v[1])); }
    else { F(`${tag}-BASE-L`,wx,0,R.z); F(`${tag}-BASE-R`,wx,0,R.z+R.d);
      Won(wall,`${tag}-WALL-C`,wx,1.0,cz);
      const o=.1; [[0,-o,1],[o,0,2],[0,o,3],[-o,0,4]].forEach(v=>F(`${tag}-WASTE01-${v[2]}`,cx+v[0],0,cz+v[1])); }
  }
  if(fx.type==="WC"){
    const side=fx.side, wall=R.wall;
    const wz = side==="N" ? r.z : side==="S" ? r.z+r.d : null;
    const wx = side==="E" ? r.x+r.w : side==="W" ? r.x : null;
    F(`${tag}-BASE-L`,cx-(wz!==null?.15:0),0,cz-(wx!==null?.15:0));
    F(`${tag}-BASE-R`,cx+(wz!==null?.15:0),0,cz+(wx!==null?.15:0));
    if(wz!==null){ Won(wall,`${tag}-WALL-C`,cx,0.6,wz); Won(wall,`${tag}-SUPPLY01`,cx-.2,0.25,wz); }
    else { Won(wall,`${tag}-WALL-C`,wx,0.6,cz); Won(wall,`${tag}-SUPPLY01`,wx,0.25,cz-.2); }
  }
  if(fx.type==="BATH"){
    const wz = fx.side==="N" ? r.z : fx.side==="S" ? r.z+r.d : null;
    // perimeter: corner-centre-corner along the open long edge + junctions at wall
    const oz = wz===null ? cz : (fx.side==="N" ? R.z+R.d : R.z);
    if(wz!==null){
      F(`${tag}-EDGE-L`,R.x,0,oz); F(`${tag}-EDGE-C`,cx,0,oz); F(`${tag}-EDGE-R`,R.x+R.w,0,oz);
      Won(R.wall,`${tag}-TAP01`,cx,0.75,wz);
    } else {
      const wx = fx.side==="E" ? r.x+r.w : r.x, ox = fx.side==="E" ? R.x : R.x+R.w;
      F(`${tag}-EDGE-L`,ox,0,R.z); F(`${tag}-EDGE-C`,ox,0,cz); F(`${tag}-EDGE-R`,ox,0,R.z+R.d);
      Won(R.wall,`${tag}-TAP01`,wx,0.75,cz);
    }
  }
  return P;
}

/* ---------- 3. MODEL ASSEMBLY -------------------------------------------- */
function build(ast){
  const model={ rooms:ast.rooms, points:[], walls:[], fixtures:[], roof:null, opt:ast.opt, home:ast.home };
  // external test: probe just outside the wall midpoint; internal if inside another room
  const inRoom=(x,z,not)=>ast.rooms.some(q=>q!==not && x>q.x+1e-4 && x<q.x+q.w-1e-4 && z>q.z+1e-4 && z<q.z+q.d-1e-4);
  const isExt=(r,side)=>{
    const eps=.15, cx=r.x+r.w/2, cz=r.z+r.d/2;
    const px = side==="E"?r.x+r.w+eps : side==="W"?r.x-eps : cx;
    const pz = side==="N"?r.z-eps     : side==="S"?r.z+r.d+eps : cz;
    return !inRoom(px,pz,r);
  };
  ast.rooms.forEach(r=>{
    SIDES.forEach(s=>{
      const f=wallFrame(r,s.k), ext=isExt(r,s.k);
      const wobs=(r.wallobs||[]).filter(o=>o.side===s.k);
      model.walls.push({room:r.code, wall:s.wall, side:s.k, frame:f, len:f.len, h:r.h, ext,
        openings:r.openings.filter(o=>o.side===s.k), wallobs:wobs});
      const wp=wallPoints(r,s.k,ast.opt.spacing);
      // wall objects: aircon adds a 4-pt set; all objects obstruct points behind them
      let obIdx=0;
      wobs.forEach(ob=>{
        obIdx++;
        const bC = ob.mount==="high" ? (r.h-0.45)/r.h : ob.mount==="mid" ? (0.9+ob.h/2)/r.h : (ob.h/2)/r.h;
        const aC = ob.off!==null&&ob.off!==undefined ? (ob.off+ob.w/2)/f.len : .5;
        ob._a0=aC-(ob.w/f.len)/2; ob._a1=aC+(ob.w/f.len)/2;
        ob._b0=bC-(ob.h/r.h)/2;   ob._b1=bC+(ob.h/r.h)/2;
        if(ob.type==="AC"){
          const tag="AC"+String(obIdx).padStart(2,"0"), m=.09, W=s.wall;
          [[0,ob.h/r.h/2+.03,1],[ob.w/f.len/2+.03,0,2],[0,-(ob.h/r.h/2+.03),3],[-(ob.w/f.len/2+.03),0,4]].forEach(v=>{
            wp.push({id:`${r.code}-${W}-PEN-${tag}-${v[2]}`,fam:"PEN",pos:at(f,aC+v[0],bC+v[1]),
              room:r.code,surface:W,ref:`${tag}-${v[2]}`,a:aC+v[0],b:bC+v[1]});
          });
        }
      });
      // reclassify FACE/EDGE points behind an object: Obstructed, not missing (V1.2 status rule)
      wp.forEach(p=>{
        if(p.a===undefined) return;
        wobs.forEach(ob=>{
          if(ob.type==="AC") return;
          if(p.a>=ob._a0&&p.a<=ob._a1&&p.b>=ob._b0&&p.b<=ob._b1) p.status="Obstructed";
        });
      });
      wp.forEach(p=>p.ext=ext);
      model.points.push(...wp);
      r.openings.filter(o=>o.side===s.k).forEach((o,i)=>{
        const op=openingPoints(r,s.k,i,o); op.forEach(p=>p.ext=ext); model.points.push(...op);
      });
    });
    model.points.push(...planPoints(r,"FLR"), ...planPoints(r,"CEIL"));
    r.pens.forEach((p,i)=>model.points.push(...penPoints(r,p,i)));
    const typeCount={};
    (r.fixtures||[]).forEach(fx=>{
      typeCount[fx.type]=(typeCount[fx.type]||0)+1;
      model.points.push(...fixturePoints(r,fx,typeCount[fx.type]-1));
      model.fixtures.push({room:r.code, type:fx.type, rect:fixtureRect(r,fx),
        h: fx.type==="SHWR"?1.85 : fx.type==="VAN"?0.85 : fx.type==="WC"?0.8 : 0.55});
    });
  });
  // external risk objects -> world geometry + risk flag on internal wall points nearby
  model.extrisk=[];
  ast.rooms.forEach(r=>{
    (r.extobjs||[]).forEach(ob=>{
      const f=wallFrame(r,ob.side), out=.12;
      const nrm = ob.side==="N"?[0,-1] : ob.side==="S"?[0,1] : ob.side==="E"?[1,0] : [-1,0];
      if(ob.type==="STORMWATER"){
        const p0=at(f,0,0), p1=at(f,1,0);
        model.extrisk.push({type:"STORMWATER", room:r.code, side:ob.side,
          a:[p0[0]+nrm[0]*.4,-.25,p0[2]+nrm[1]*.4], b:[p1[0]+nrm[0]*.4,-.25,p1[2]+nrm[1]*.4]});
        // whole base run of that wall is watch territory
        model.points.forEach(p=>{ if(p.room===r.code && p.surface===SIDES.find(x=>x.k===ob.side).wall && p.pos[1]<.3) p.risk=true; });
      } else {
        const aoff = ob.off!==null&&ob.off!==undefined ? ob.off/f.len : .9;
        const base=at(f,aoff,0), wx=base[0]+nrm[0]*out, wz=base[2]+nrm[1]*out;
        model.extrisk.push({type:ob.type, room:r.code, side:ob.side,
          x:wx, z:wz, h:ob.type==="DOWNPIPE"?r.h+.15:.5});
        // wall points within 0.8 m of the object base get the risk ring
        model.points.forEach(p=>{
          if(p.a===undefined) return;
          const d=Math.hypot(p.pos[0]-wx,p.pos[2]-wz);
          if(d<=.8 && p.pos[1]<=1.2) p.risk=true;
        });
      }
    });
  });

  // air + EM tests
  ast.rooms.forEach(r=>{
    const counts={};
    (r.airtests||[]).forEach(t=>{
      counts[t.type]=(counts[t.type]||0)+1;
      const tag=(t.type==="SMOKE"?"SMK":t.type==="FLOW"?"FLW":"EMF")+String(counts[t.type]).padStart(2,"0");
      if(t.type==="EMF"){
        model.points.push({id:`${r.code}-FLR-EMF-${tag}`,fam:"EMF",room:r.code,surface:"FLR",
          ref:tag,pos:[r.x+r.w/2,1.0,r.z+r.d/2]});
        return;
      }
      const f=wallFrame(r,t.side), W=SIDES.find(x=>x.k===t.side).wall;
      const op=r.openings.find(o=>o.side===t.side);
      // at the opening: smoke tests the leakage edge (sill/head + undercut), flow reads the centre
      const b = op ? (op.kind==="door" ? (t.type==="SMOKE"?0.02:0.5*op.h/r.h)
                                       : ((0.9+(t.type==="SMOKE"?0:op.h/2))/r.h))
                   : (t.type==="SMOKE"?0.02:0.5);
      model.points.push({id:`${r.code}-${W}-${t.type}-${tag}`,fam:t.type,room:r.code,surface:W,
        ref:tag,pos:at(f,.5,b),a:.5,b});
    });
  });

  // sensors: room centre at 1.2 m per the ambient rule
  model.sensors=[]; let sN=0;
  ast.rooms.forEach(r=>{ if(r.sensor){ sN++;
    model.sensors.push({id:"AR-"+String(sN).padStart(2,"0"), room:r.code,
      pos:[r.x+r.w/2, 1.2, r.z+r.d/2]}); } });

  // access class: ladder above standing reach, and every ceiling point
  model.points.forEach(p=>{
    p.access = (p.surface==="CEIL" || p.pos[1]>=REACH) ? "ladder" : "floor";
  });

  // envelope for subfloor + roof: bounding box of all rooms
  if(ast.rooms.length){
    const xs=ast.rooms.flatMap(r=>[r.x,r.x+r.w]), zs=ast.rooms.flatMap(r=>[r.z,r.z+r.d]);
    const hmax=Math.max(...ast.rooms.map(r=>r.h));
    model.env={x0:Math.min(...xs),x1:Math.max(...xs),z0:Math.min(...zs),z1:Math.max(...zs),h:hmax};
  }
  return model;
}

/* ---------- 3b. DEMO READING STATUSES ------------------------------------ */
// Four-status model (working set, definitions not locked for publication):
// Stable · Monitor · Elevated · Further Investigation Required
// Demo values only - deterministic per point id, so the picture holds still.
function hash01(str){ let h=2166136261;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return ((h>>>0)%1000)/1000; }
const ST_COL={ "Stable":"--st-stable","Monitor":"--st-monitor","Elevated":"--st-elevated",
  "Further Investigation Required":"--st-fir","Obstructed":"--pt-skip" };
function demoStatus(p){
  if(p.status==="Obstructed") return "Obstructed";
  if(PULL && p.room===PULL.room && p.surface===PULL.wall && p.a!==undefined){
    // crafted cluster at the downpipe end, low on the wall, grading outward
    const d=Math.hypot((p.a-0.13)*1.6, p.b-0.10);
    if(d<0.22) return "Further Investigation Required";
    if(d<0.45) return "Elevated";
    if(d<0.75) return "Monitor";
    return "Stable";
  }
  const h=hash01(p.id);
  if(h<0.80) return "Stable";
  if(h<0.92) return "Monitor";
  if(h<0.97) return "Elevated";
  return "Monitor"; // scatter never invents FIR - that stays with the crafted cluster
}

// pseudo surface temps for the demo: status band + per-point jitter. NOT measurement.
function demoTemp(p){
  const st=demoStatus(p), j=hash01(p.id+"t");
  return st==="Further Investigation Required"?27.5+j*2.5
       : st==="Elevated"?24+j*2 : st==="Monitor"?20.5+j*2 : 17.5+j*2;
}
// iron/FLIR-style ramp, t in [16,30]
function ironCol(t){
  const x=Math.min(1,Math.max(0,(t-16)/14));
  const stops=[[13,8,60],[92,10,120],[176,32,120],[228,88,40],[248,166,20],[252,244,160]];
  const f=x*(stops.length-1), i=Math.min(stops.length-2,Math.floor(f)), u=f-i;
  const c=stops[i].map((v,k)=>Math.round(v+(stops[i+1][k]-v)*u));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

let LAYERS={ floor:true, walls:true, intwalls:true, ceiling:false, roof:true, subfloor:true, fixtures:true, extrisk:true, sensors:true, demo:true, thermal:true, frames:true, airtests:true, points:true, labels:true };
let PULL={room:"LIV-01", wall:"W1"};   // wall pulled out for review; null = none
let MODEL=null;

function project(p){
  const cy2=Math.cos(cam.yaw), sy=Math.sin(cam.yaw), cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  let x=p[0]-cam.cx, y=p[1]-cam.cy, z=p[2]-cam.cz;
  let x1=x*cy2 - z*sy, z1=x*sy + z*cy2;
  let y2=y*cp - z1*sp, z2=y*sp + z1*cp;
  const d=cam.dist, f=VH*0.9;
  const s=f/(d+z2+0.001);
  return {x:VW/2 + x1*s, y:VH/2 - y2*s, s, depth:z2};
}
function line(a,b,col,w,dash){
  const A=project(a), B=project(b);
  ctx.strokeStyle=col; ctx.lineWidth=w||1; ctx.setLineDash(dash||[]);
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke(); ctx.setLineDash([]);
}
function poly(pts,fill,stroke,w){
  ctx.beginPath();
  pts.forEach((p,i)=>{ const P=project(p); i?ctx.lineTo(P.x,P.y):ctx.moveTo(P.x,P.y); });
  ctx.closePath();
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=w||1; ctx.stroke(); }
}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let VW=0,VH=0;
function draw(){
  VW=cv.clientWidth; VH=cv.clientHeight;
  const dpr=devicePixelRatio||1;
  if(cv.width!==Math.round(VW*dpr)||cv.height!==Math.round(VH*dpr)){
    cv.width=Math.round(VW*dpr); cv.height=Math.round(VH*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=css("--viewport"); ctx.fillRect(0,0,VW,VH);
  if(!MODEL||!MODEL.env) return;

  // ground grid
  const g=css("--grid"), e=MODEL.env, pad=3;
  for(let x=Math.floor(e.x0-pad); x<=Math.ceil(e.x1+pad); x++)
    line([x,0,e.z0-pad],[x,0,e.z1+pad],g,1);
  for(let z=Math.floor(e.z0-pad); z<=Math.ceil(e.z1+pad); z++)
    line([e.x0-pad,0,z],[e.x1+pad,0,z],g,1);

  const wl=css("--wallline"), wf=css("--wallfill");

  // subfloor (piers below floor plane)
  if(LAYERS.subfloor && MODEL.opt.floorheight>0){
    const fh=MODEL.opt.floorheight;
    MODEL.rooms.forEach(r=>{
      [[r.x,r.z],[r.x+r.w,r.z],[r.x,r.z+r.d],[r.x+r.w,r.z+r.d]].forEach(c=>
        line([c[0],-fh,c[1]],[c[0],0,c[1]],wl,2));
    });
  }
  const lift=MODEL.opt.floorheight>0 && LAYERS.subfloor ? 0 : 0;

  // floors
  if(LAYERS.floor) MODEL.rooms.forEach(r=>{
    const self=typeof SEL!=="undefined"&&SEL&&SEL.room===r.code&&SEL.surface==="FLR";
    poly([[r.x,0,r.z],[r.x+r.w,0,r.z],[r.x+r.w,0,r.z+r.d],[r.x,0,r.z+r.d]],css("--floorfill"),self?css("--pt-face"):wl,self?2.5:1.5);
  });

  // fixtures as simple prisms
  if(LAYERS.fixtures && !cam.planMode && MODEL.fixtures) MODEL.fixtures.forEach(fx=>{
    const R=fx.rect, col=css("--pt-pen");
    const c=[[R.x,R.z],[R.x+R.w,R.z],[R.x+R.w,R.z+R.d],[R.x,R.z+R.d]];
    const hTop = fx.type==="SHWR" ? 0.05 : fx.h;   // shower tray is low; screen drawn separately
    poly(c.map(p=>[p[0],0,p[1]]),"rgba(58,167,101,.10)",col,1.2);
    poly(c.map(p=>[p[0],hTop,p[1]]),null,col,1);
    c.forEach(p=>line([p[0],0,p[1]],[p[0],hTop,p[1]],col,1));
    if(fx.type==="SHWR"){ // screen posts to 1.85 on the two open edges
      c.forEach(p=>line([p[0],0.05,p[1]],[p[0],fx.h,p[1]],col,0.6));
      poly(c.map(p=>[p[0],fx.h,p[1]]),null,col,0.6);
    }
  });
  if(LAYERS.fixtures && cam.planMode && MODEL.fixtures) MODEL.fixtures.forEach(fx=>{
    const R=fx.rect, col=css("--pt-pen");
    poly([[R.x,0,R.z],[R.x+R.w,0,R.z],[R.x+R.w,0,R.z+R.d],[R.x,0,R.z+R.d]],"rgba(58,167,101,.10)",col,1.2);
  });

  // external risk objects: downpipes, taps, stormwater runs
  if(LAYERS.extrisk && !cam.planMode && MODEL.extrisk) MODEL.extrisk.forEach(ob=>{
    const col=css("--pt-elev");
    if(ob.type==="STORMWATER"){
      ctx.setLineDash([5,4]); line(ob.a,ob.b,col,1.6); ctx.setLineDash([]);
      const mid=[(ob.a[0]+ob.b[0])/2,(ob.a[1]+ob.b[1])/2,(ob.a[2]+ob.b[2])/2];
      const M=project(mid); ctx.fillStyle=col; ctx.font="9px IBM Plex Mono"; ctx.fillText("stormwater",M.x+4,M.y-2);
    } else if(ob.type==="DOWNPIPE"){
      line([ob.x,0,ob.z],[ob.x,ob.h,ob.z],col,2.4);
      line([ob.x-.05,0,ob.z-.05],[ob.x-.05,ob.h,ob.z-.05],col,1);
      const M=project([ob.x,ob.h,ob.z]); ctx.fillStyle=col; ctx.font="9px IBM Plex Mono"; ctx.fillText("DP",M.x+3,M.y);
    } else { // TAP
      const M=project([ob.x,.5,ob.z]);
      ctx.strokeStyle=col; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(M.x,M.y,4,0,7); ctx.stroke();
      line([ob.x,0,ob.z],[ob.x,.5,ob.z],col,1.4);
      ctx.fillStyle=col; ctx.font="9px IBM Plex Mono"; ctx.fillText("tap",M.x+6,M.y);
    }
  });

  // pulled-wall offset: outward normal x 2.2 m
  const pullOff=w=>{
    const n={N:[0,0,-1],S:[0,0,1],E:[1,0,0],W:[-1,0,0]}[w.side];
    return [n[0]*3.0, 0.2, n[2]*3.0];
  };
  const isPulled=w=>PULL && w.room===PULL.room && w.wall===PULL.wall;
  const shift=(p,o)=>[p[0]+o[0],p[1]+o[1],p[2]+o[2]];

  // walls as wireframe faces w/ openings
  if(LAYERS.walls && !cam.planMode) MODEL.walls.forEach(w=>{
    if(!w.ext && !LAYERS.intwalls) return;
    const f=w.frame, pulled=isPulled(w), o=pulled?pullOff(w):[0,0,0];
    const selw=typeof SEL!=="undefined"&&SEL&&SEL.room===w.room&&SEL.surface===w.wall;
    if(pulled){ // ghost at original position + leaders
      ctx.setLineDash([4,4]);
      poly([at(f,0,0),at(f,1,0),at(f,1,1),at(f,0,1)],null,css("--pt-skip"),1);
      ctx.setLineDash([]);
      [[0,0],[1,0],[1,1],[0,1]].forEach(c=>{
        ctx.setLineDash([2,5]);
        line(at(f,c[0],c[1]),shift(at(f,c[0],c[1]),o),css("--pt-skip"),0.8);
        ctx.setLineDash([]);
      });
    }
    if(pulled && LAYERS.thermal && LAYERS.demo){
      // interpolated surface: IDW over this wall's own spot values. Demo values.
      const wpts=MODEL.points.filter(p=>p.room===w.room&&p.surface===w.wall&&p.a!==undefined)
        .map(p=>({a:p.a,b:p.b,t:demoTemp(p)}));
      const nx=Math.min(56,Math.max(20,Math.round(f.len*9))), ny=Math.min(32,Math.max(12,Math.round(w.h*9)));
      let tmax=-1e9, tmaxCell=null;
      for(let i=0;i<nx;i++) for(let j=0;j<ny;j++){
        const a0=i/nx, a1=(i+1)/nx, b0=j/ny, b1=(j+1)/ny, ac=(a0+a1)/2, bc=(b0+b1)/2;
        let sw=0, sv=0;
        wpts.forEach(q=>{ const d2=(q.a-ac)*(q.a-ac)*2.2+(q.b-bc)*(q.b-bc)+1e-4;
          const wgt=1/d2; sw+=wgt; sv+=wgt*q.t; });
        const t=sv/sw;
        if(t>tmax){ tmax=t; tmaxCell=[ac,bc]; }
        poly([shift(at(f,a0,b0),o),shift(at(f,a1,b0),o),shift(at(f,a1,b1),o),shift(at(f,a0,b1),o)],
             ironCol(t), null, 0);
      }
      poly([shift(at(f,0,0),o),shift(at(f,1,0),o),shift(at(f,1,1),o),shift(at(f,0,1),o)],
           null, css("--st-fir"), 2);
      // FLIR-style hot-spot marker
      if(tmaxCell){
        const M=project(shift(at(f,tmaxCell[0],tmaxCell[1]),o));
        ctx.strokeStyle="#fff"; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.moveTo(M.x-6,M.y); ctx.lineTo(M.x+6,M.y);
        ctx.moveTo(M.x,M.y-6); ctx.lineTo(M.x,M.y+6); ctx.stroke();
        ctx.fillStyle="#fff"; ctx.font="600 11px IBM Plex Mono";
        ctx.fillText(tmax.toFixed(1)+"\u00B0C",M.x+9,M.y-4);
      }
      // scale bar under the pulled wall
      const s0=project(shift(at(f,0,-0.14),o)), s1=project(shift(at(f,1,-0.14),o));
      const steps=24;
      for(let i=0;i<steps;i++){
        ctx.strokeStyle=ironCol(16+14*i/(steps-1)); ctx.lineWidth=5;
        ctx.beginPath();
        ctx.moveTo(s0.x+(s1.x-s0.x)*i/steps, s0.y+(s1.y-s0.y)*i/steps);
        ctx.lineTo(s0.x+(s1.x-s0.x)*(i+1)/steps, s0.y+(s1.y-s0.y)*(i+1)/steps);
        ctx.stroke();
      }
      ctx.fillStyle=css("--ink-2"); ctx.font="9px IBM Plex Mono";
      ctx.fillText("16\u00B0",s0.x,s0.y+14); ctx.fillText("30\u00B0",s1.x-18,s1.y+14);
    } else {
      poly([shift(at(f,0,0),o),shift(at(f,1,0),o),shift(at(f,1,1),o),shift(at(f,0,1),o)],
           wf, pulled?css("--st-fir"):(selw?css("--pt-face"):wl), pulled?2:(selw?2.5:1.5));
    }
    w.openings.forEach(op=>{
      const sill=op.kind==="door"?0:0.9;
      const a0=.5-(op.w/f.len)/2, a1=.5+(op.w/f.len)/2, b0=sill/w.h, b1=(sill+op.h)/w.h;
      poly([shift(at(f,a0,b0),o),shift(at(f,a1,b0),o),shift(at(f,a1,b1),o),shift(at(f,a0,b1),o)],null,wl,1);
    });
    if(pulled){
      const t=project(shift(at(f,.5,1.12),o));
      ctx.fillStyle=css("--st-fir"); ctx.font="600 11px IBM Plex Sans Condensed";
      ctx.fillText(`${w.room}-${w.wall} · pulled for review`,t.x-60,t.y);
    }
  });

  // ceilings
  if(LAYERS.ceiling && !cam.planMode) MODEL.rooms.forEach(r=>
    poly([[r.x,r.h,r.z],[r.x+r.w,r.h,r.z],[r.x+r.w,r.h,r.z+r.d],[r.x,r.h,r.z+r.d]],css("--ceilfill"),wl,1));

  // roof over envelope
  if(LAYERS.roof && !cam.planMode){
    const {x0,x1,z0,z1,h}=MODEL.env, ev=MODEL.opt.eaves, p=MODEL.opt.pitch*Math.PI/180;
    const rx0=x0-ev, rx1=x1+ev, rz0=z0-ev, rz1=z1+ev, span=(rz1-rz0)/2;
    const ridge=h+Math.tan(p)*span;
    if(MODEL.opt.roof==="flat"){
      poly([[rx0,h,rz0],[rx1,h,rz0],[rx1,h,rz1],[rx0,h,rz1]],null,wl,1.5);
    }else if(MODEL.opt.roof==="skillion"){
      poly([[rx0,h,rz1],[rx1,h,rz1],[rx1,h+Math.tan(p)*(rz1-rz0),rz0],[rx0,h+Math.tan(p)*(rz1-rz0),rz0]],null,wl,1.5);
    }else{ // gable (hip drawn as gable ends pulled in)
      const zm=(rz0+rz1)/2, inset=MODEL.opt.roof==="hip"?span:0;
      poly([[rx0,h,rz0],[rx1,h,rz0],[rx1+ (MODEL.opt.roof==="hip"?-inset:0),ridge,zm],[rx0+(MODEL.opt.roof==="hip"?inset:0),ridge,zm]],null,wl,1.5);
      poly([[rx0,h,rz1],[rx1,h,rz1],[rx1+(MODEL.opt.roof==="hip"?-inset:0),ridge,zm],[rx0+(MODEL.opt.roof==="hip"?inset:0),ridge,zm]],null,wl,1.5);
      line([rx0+(MODEL.opt.roof==="hip"?inset:0),ridge,zm],[rx1+(MODEL.opt.roof==="hip"?-inset:0),ridge,zm],wl,2);
    }
  }

  // points
  if(LAYERS.points){
    const colours={FACE:css("--pt-face"),GRID:css("--pt-face"),EDGE:css("--pt-edge"),OPENING:css("--pt-edge"),PEN:css("--pt-pen"),FIX:css("--pt-pen"),SMOKE:css("--air"),FLOW:css("--air"),EMF:css("--emf")};
    MODEL.points.forEach(pt=>{
      if(!LAYERS.ceiling && pt.surface==="CEIL") return;
      if(pt.ext===false && !LAYERS.intwalls) return;
      if((pt.fam==="SMOKE"||pt.fam==="FLOW"||pt.fam==="EMF") && !LAYERS.airtests) return;
      let pos=pt.pos;
      if(PULL && pt.room===PULL.room && pt.surface===PULL.wall){
        if(LAYERS.thermal && LAYERS.demo) return; // heat surface speaks for itself
        const w=MODEL.walls.find(x=>x.room===PULL.room&&x.wall===PULL.wall);
        if(w) pos=shift(pos,pullOff(w));
      }
      const P=project(pos); if(P.depth<-cam.dist+0.5) return;
      const rr=Math.max(1.6,Math.min(3.4,P.s*0.02));
      let col;
      if(LAYERS.demo){ const st=demoStatus(pt); col=css(ST_COL[st]);
        if(st==="Further Investigation Required"){ ctx.strokeStyle=col; ctx.lineWidth=1.4;
          ctx.beginPath(); ctx.arc(P.x,P.y,rr+2.6,0,7); ctx.stroke(); } }
      else col=pt.status==="Obstructed"?css("--pt-skip"):(colours[pt.fam]||css("--pt-skip"));
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(P.x,P.y,rr,0,7); ctx.fill();
      if(pt.risk && LAYERS.extrisk && !LAYERS.demo){ ctx.strokeStyle=css("--pt-elev"); ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.arc(P.x,P.y,rr+2.4,0,7); ctx.stroke(); }
      // device glyphs so the tests read as tests, not readings
      if(pt.fam==="SMOKE"){ ctx.strokeStyle=css("--air"); ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.moveTo(P.x,P.y-3);
        ctx.bezierCurveTo(P.x-3,P.y-7,P.x+3,P.y-9,P.x,P.y-13);
        ctx.bezierCurveTo(P.x-3,P.y-16,P.x+2,P.y-18,P.x,P.y-20); ctx.stroke(); }
      if(pt.fam==="FLOW"){ ctx.strokeStyle=css("--air"); ctx.lineWidth=1.3;
        ctx.beginPath(); ctx.moveTo(P.x-9,P.y-6); ctx.lineTo(P.x+9,P.y-6);
        ctx.moveTo(P.x+5,P.y-9); ctx.lineTo(P.x+9,P.y-6); ctx.lineTo(P.x+5,P.y-3);
        ctx.moveTo(P.x-5,P.y-9); ctx.lineTo(P.x-9,P.y-6); ctx.lineTo(P.x-5,P.y-3); ctx.stroke(); }
      if(pt.fam==="EMF"){ ctx.strokeStyle=css("--emf"); ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.arc(P.x,P.y,5,-2.2,-0.9); ctx.stroke();
        ctx.beginPath(); ctx.arc(P.x,P.y,8.5,-2.2,-0.9); ctx.stroke(); }
    });
  }

  // sensors: diamond on a stem with a pulse ring - deliberately unlike any point
  if(LAYERS.sensors && MODEL.sensors) MODEL.sensors.forEach(sn=>{
    const col=css("--sensor");
    if(!cam.planMode) line([sn.pos[0],0,sn.pos[2]],sn.pos,col,1);
    const P=project(cam.planMode?[sn.pos[0],0,sn.pos[2]]:sn.pos);
    const r=6;
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.moveTo(P.x,P.y-r); ctx.lineTo(P.x+r*.8,P.y); ctx.lineTo(P.x,P.y+r); ctx.lineTo(P.x-r*.8,P.y);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(P.x,P.y,r+4,0,7); ctx.stroke();
    ctx.font="9px IBM Plex Mono"; ctx.fillText(sn.id,P.x+r+7,P.y+3);
  });

  // thermal frame markers: camera chips
  if(LAYERS.frames && typeof FRAMES!=="undefined") FRAMES.forEach(fr2=>{
    let pos=fr2.pos;
    if(fr2.wall && PULL){ const [rr,ww]=fr2.wall.split("|");
      if(PULL.room===rr&&PULL.wall===ww){ const w=MODEL.walls.find(x=>x.room===rr&&x.wall===ww);
        if(w) pos=shift(pos,pullOff(w)); } }
    const P=project(pos);
    ctx.fillStyle=css("--panel"); ctx.strokeStyle=css("--ink"); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.roundRect(P.x-8,P.y-6,16,12,2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(P.x,P.y,2.6,0,7); ctx.stroke();
    ctx.fillStyle=css("--ink-2"); ctx.font="8px IBM Plex Mono";
    ctx.fillText(fr2.id,P.x+10,P.y+3);
  });

  // reading-status legend, bottom right, only in demo colours
  if(LAYERS.demo){
    const items=[["Stable","--st-stable"],["Monitor","--st-monitor"],["Elevated","--st-elevated"],
                 ["Further investigation","--st-fir"],["Obstructed","--pt-skip"]];
    ctx.font="10px IBM Plex Sans"; const lh=16;
    const wBox=172, hBox=items.length*lh+20, x0=VW-wBox-12, y0=VH-hBox-12;
    ctx.fillStyle=css("--panel"); ctx.strokeStyle=css("--rule");
    ctx.beginPath(); ctx.rect(x0,y0,wBox,hBox); ctx.fill(); ctx.stroke();
    ctx.textAlign="left"; ctx.textBaseline="middle";
    items.forEach((it,i)=>{
      const y=y0+12+i*lh;
      ctx.fillStyle=css(it[1]); ctx.beginPath(); ctx.arc(x0+16,y,3.4,0,7); ctx.fill();
      ctx.fillStyle=css("--ink-2"); ctx.fillText(it[0],x0+28,y);
    });
    ctx.fillStyle=css("--muted"); ctx.font="8.5px IBM Plex Sans";
    ctx.fillText("demo values - not measured",x0+16,y0+hBox-8);
    ctx.textBaseline="alphabetic";
  }

  // labels
  if(LAYERS.labels){
    ctx.font="600 11px 'IBM Plex Sans Condensed', sans-serif";
    ctx.fillStyle=css("--ink-2"); ctx.textAlign="center";
    MODEL.rooms.forEach(r=>{
      const P=project([r.x+r.w/2, cam.planMode? 0 : r.h+0.15, r.z+r.d/2]);
      ctx.fillText(`${r.code} · ${r.w}×${r.d}×${r.h}`,P.x,P.y);
    });
  }
}

/* ---------- 5. UI WIRING -------------------------------------------------- */
const $=id=>document.getElementById(id);
const src=$("src"), errBox=$("errors"), tally=$("tally"), rail=$("rail");

const LAYERDEFS=[
  ["floor","Floor","--pt-face"],["walls","Walls","--pt-edge"],["intwalls","Internal walls","--pt-skip"],["ceiling","Ceiling","--pt-edge"],
  ["roof","Roof line","--pt-skip"],["subfloor","Subfloor","--pt-skip"],
  ["fixtures","Fixtures","--pt-pen"],["extrisk","Ext risk","--pt-elev"],["sensors","Sensors","--sensor"],["demo","Readings demo","--st-fir"],["thermal","Thermal wall","--st-elevated"],["frames","Thermal frames","--pt-skip"],["airtests","Air + EM tests","--air"],["points","Points","--pt-pen"],["labels","Labels","--pt-skip"]
];
rail.innerHTML=LAYERDEFS.map(([k,n,c])=>
  `<button data-layer="${k}" aria-pressed="${LAYERS[k]}"><span class="swatch" style="background:var(${c})"></span>${n}</button>`).join("");
rail.addEventListener("click",e=>{
  const b=e.target.closest("button[data-layer]"); if(!b) return;
  const k=b.dataset.layer; LAYERS[k]=!LAYERS[k]; b.setAttribute("aria-pressed",LAYERS[k]); draw();
  if(["intwalls","ceiling","airtests"].includes(k)&&MODEL) renderTally(null);
});
["screen","standard","dense"].forEach(d=>{
  $("d-"+d).onclick=()=>{ DENSITY=d;
    ["screen","standard","dense"].forEach(x=>$("d-"+x).setAttribute("aria-pressed",x===d));
    refresh(); };
});

let SECS={floor:15, ladder:40, test:120}; // floor+ladder calibrated by Joe 26 Aug (continuous single-pass run); test rate still a placeholder
function renderTally(ast){
  const rooms=(ast?ast.rooms:MODEL.rooms).length, walls=MODEL.walls.length;
  const pts=activePoints();
  const by=f=>pts.filter(p=>p.fam===f).length;
  const obst=pts.filter(p=>p.status==="Obstructed").length;
  const isTest=p=>p.fam==="SMOKE"||p.fam==="FLOW"||p.fam==="EMF";
  const tests=pts.filter(isTest).length;
  const measurable=pts.filter(p=>p.status!=="Obstructed"&&!isTest(p));
  const lad=measurable.filter(p=>p.access==="ladder").length;
  const flr=measurable.length-lad;
  const secs=flr*SECS.floor+lad*SECS.ladder+tests*SECS.test;
  const h=Math.floor(secs/3600), m=Math.round((secs%3600)/60);
  const extW=MODEL.walls.filter(w=>w.ext).length;
  tally.innerHTML=`
    <div class="cell"><span class="lbl">Rooms</span><div class="n">${rooms}</div></div>
    <div class="cell"><span class="lbl">Walls</span><div class="n">${walls}<span style="font-size:11px;color:var(--muted)"> · ${extW} ext</span></div></div>
    <div class="cell"><span class="lbl">Edge</span><div class="n">${by("EDGE")}</div></div>

let dragging=false,lx=0,ly=0,panning=false;
cv.addEventListener("pointerdown",e=>{ dragging=true; panning=e.shiftKey; lx=e.clientX; ly=e.clientY; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  if(panning){ const k=cam.dist/600;
    cam.cx-=(dx*Math.cos(cam.yaw)+0*dy)*k; cam.cz-=(-dx*Math.sin(cam.yaw))*k; cam.cy+=dy*k; }
  else if(!cam.planMode){ cam.yaw+=dx*0.008; cam.pitch=Math.min(1.52,Math.max(-1.52,cam.pitch-dy*0.006)); }
  else { const k=cam.dist/600; cam.cx-=dx*k; cam.cz-=dy*k; }
  draw();
});
cv.addEventListener("pointerup",()=>{ dragging=false; cv.classList.remove("drag"); });
cv.addEventListener("wheel",e=>{ e.preventDefault(); cam.dist=Math.min(80,Math.max(4,cam.dist*(e.deltaY>0?1.09:0.92))); draw(); },{passive:false});

  else if(cam._save){ cam.yaw=cam._save.yaw; cam.pitch=cam._save.pitch; }

function wallElevationSVG(w){
  // drawing space: wall length x height, padded for labels
  const padL=44, padR=16, padT=16, padB=30;
  const scale=Math.min( (340-padL-padR)/w.len, 150/w.h );
  const dw=w.len*scale, dh=w.h*scale;
  const W=dw+padL+padR, H=dh+padT+padB;
  const X=a=>padL+a*dw, Y=b=>padT+(1-b)*dh;
  let s=`<svg viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" role="img" aria-label="${w.room} ${w.wall} elevation">`;
  // wall outline
  s+=`<rect x="${X(0)}" y="${Y(1)}" width="${dw.toFixed(1)}" height="${dh.toFixed(1)}"
       fill="var(--wallfill)" stroke="var(--wallline)" stroke-width="1.5"/>`;
  // openings
  w.openings.forEach(o=>{
    const sill=o.kind==="door"?0:0.9;
    const a0=.5-(o.w/w.len)/2, a1=.5+(o.w/w.len)/2, b0=sill/w.h, b1=Math.min(1,(sill+o.h)/w.h);
    s+=`<rect x="${X(a0)}" y="${Y(b1)}" width="${((a1-a0)*dw).toFixed(1)}" height="${((b1-b0)*dh).toFixed(1)}"
         fill="none" stroke="var(--wallline)" stroke-width="1" stroke-dasharray="${o.kind==="door"?"":"3 2"}"/>`;
  });
  // points for this wall from the model
  const pts=MODEL.points.filter(p=>p.room===w.room && p.surface===w.wall);
  // recover (a,b) from 3D position via the wall frame
  const f=w.frame, ux=f.u[0]||f.u[2], axis=f.u[0]!==0?0:2;
  pts.forEach(p=>{
    const a=(p.pos[axis]-f.o[axis])/f.u[axis];
    const b=p.pos[1]/w.h;
    let col=p.fam==="FACE"?"var(--pt-face)":p.fam==="EDGE"?"var(--pt-edge)":p.fam==="OPENING"?"var(--pt-edge)":
      (p.fam==="SMOKE"||p.fam==="FLOW")?"var(--air)":p.fam==="EMF"?"var(--emf)":"var(--pt-pen)";
    let ring="";
    if(LAYERS.demo){ const st=demoStatus(p); col=`var(${ST_COL[st]||"--pt-skip"})`;
      if(st==="Further Investigation Required") ring=`<circle cx="${X(a).toFixed(1)}" cy="${Y(b).toFixed(1)}" r="5.6" fill="none" stroke="${col}" stroke-width="1.3"/>`; }
    s+=ring+`<circle cx="${X(a).toFixed(1)}" cy="${Y(b).toFixed(1)}" r="3" fill="${col}"/>`;
    // label: short ref, offset outward for perimeter rows;
    // opening labels alternate above/below so narrow reveals stay legible
    let dy=b>0.85?-6:b<0.15?11:-6;
    let anchor=a<0.12?"start":a>0.88?"end":"middle";
    if(p.fam==="OPENING"){ const n=parseInt(p.ref.slice(-1),10); dy=(n%2? -6:11); }
    s+=`<text x="${X(a).toFixed(1)}" y="${(Y(b)+dy).toFixed(1)}" text-anchor="${anchor}"
         font-size="7.5" fill="var(--ink-2)">${p.ref}</text>`;
  });
  // dimensions
  s+=`<line x1="${X(0)}" y1="${H-14}" x2="${X(1)}" y2="${H-14}" stroke="var(--muted)" stroke-width="1"/>
      <text x="${X(.5)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--muted)">${w.len.toFixed(2)} m</text>
      <line x1="${padL-10}" y1="${Y(0)}" x2="${padL-10}" y2="${Y(1)}" stroke="var(--muted)" stroke-width="1"/>
      <text x="${padL-14}" y="${Y(.5)}" text-anchor="middle" font-size="9" fill="var(--muted)"
        transform="rotate(-90 ${padL-14} ${Y(.5)})">${w.h.toFixed(2)} m</text>`;
  s+=`</svg>`;
  return s;
}

function renderWallsView(){
  if(!MODEL){ wallsView.innerHTML=""; return; }
  const sideName={N:"North",E:"East",S:"South",W:"West"};
  const nPts=(room,surf)=>MODEL.points.filter(p=>p.room===room&&p.surface===surf).length;

  MODEL.rooms.forEach(r=>{
    cards+=`<div class="wv-room">${r.code} &middot; ${r.name||""} &middot; ${r.w.toFixed(2)} &times; ${r.d.toFixed(2)} m &middot; area ${(r.w*r.d).toFixed(1)} m&sup2;</div>`;
    MODEL.walls.filter(w=>w.room===r.code).forEach(w=>{
      const ops=w.openings.map(o=>`${o.kind} ${o.w}&times;${o.h}`).join(", ");

        <h3>${w.room}-${w.wall} &middot; ${sideName[w.side]}</h3>
        <div class="dims mono">${w.len.toFixed(2)} &times; ${w.h.toFixed(2)} m &middot; ${nPts(w.room,w.wall)} points${ops?" &middot; "+ops:""}</div>
        ${wallElevationSVG(w)}

        <h3>${r.code}-${surf} &middot; ${label}</h3>

const insp=$("inspector"), inspTitle=$("insp-title"), inspBody=$("insp-body");
let SEL=null; // {room, surface, ref?}

function planSVG(r,surface){
  const padL=40, padR=16, padT=16, padB=28;
  const scale=Math.min((280-padL-padR)/r.w, 160/r.d);
  const dw=r.w*scale, dd=r.d*scale, W=dw+padL+padR, H=dd+padT+padB;
  const X=a=>padL+a*dw, Y=b=>padT+b*dd; // north up: b=0 is north edge (z0)
  let s=`<svg viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" role="img" aria-label="${r.code} ${surface} plan">`;
  s+=`<rect x="${X(0)}" y="${Y(0)}" width="${dw.toFixed(1)}" height="${dd.toFixed(1)}"
      fill="var(--floorfill)" stroke="var(--wallline)" stroke-width="1.5"/>`;
  s+=`<text x="${X(.5)}" y="${padT-5}" text-anchor="middle" font-size="8" fill="var(--muted)">N &uarr; &middot; W1</text>`;
  if(surface==="FLR" && MODEL.fixtures) MODEL.fixtures.filter(f=>f.room===r.code).forEach(f=>{
    const a0=(f.rect.x-r.x)/r.w, b0=(f.rect.z-r.z)/r.d, fw=f.rect.w/r.w*dw, fd=f.rect.d/r.d*dd;
    s+=`<rect x="${X(a0).toFixed(1)}" y="${Y(b0).toFixed(1)}" width="${fw.toFixed(1)}" height="${fd.toFixed(1)}"
        fill="var(--pt-pen)" fill-opacity="0.10" stroke="var(--pt-pen)" stroke-width="1"/>
        <text x="${(X(a0)+fw/2).toFixed(1)}" y="${(Y(b0)+fd/2+2.5).toFixed(1)}" text-anchor="middle"
        font-size="7" fill="var(--pt-pen)">${f.type}</text>`;
  });
  const pts=MODEL.points.filter(p=>p.room===r.code && p.surface===surface);
  pts.forEach(p=>{
    const a=(p.pos[0]-r.x)/r.w, b=(p.pos[2]-r.z)/r.d;
    const col=p.fam==="GRID"?"var(--pt-face)":p.fam==="EDGE"?"var(--pt-edge)":
      (p.fam==="SMOKE"||p.fam==="FLOW")?"var(--air)":p.fam==="EMF"?"var(--emf)":"var(--pt-pen)";
    const selc=SEL&&SEL.ref===p.ref?' stroke="var(--ink)" stroke-width="1.5"':'';
    s+=`<circle cx="${X(a).toFixed(1)}" cy="${Y(b).toFixed(1)}" r="3.2" fill="${col}"${selc}/>`;
    // fixture clusters get labels only on anchor points; the table carries the rest
    const anchorPt=p.fam!=="FIX" || /-(THR-C|FW\d+-1|WASTE\d+-1|BASE-L|SCRN-J|EDGE-C|SUPPLY\d+|WALL-C)$/.test(p.ref);
    if(anchorPt){
      const short=p.fam==="FIX"?p.ref.replace(/^(SHWR|VAN|WC|BATH)\d+-/,""):p.ref;
      const dy=b<0.15?11:-6, anchor=a<0.12?"start":a>0.88?"end":"middle";
      s+=`<text x="${X(a).toFixed(1)}" y="${(Y(b)+dy).toFixed(1)}" text-anchor="${anchor}" font-size="7.5" fill="var(--ink-2)">${short}</text>`;
    }
  });
  s+=`<line x1="${X(0)}" y1="${H-12}" x2="${X(1)}" y2="${H-12}" stroke="var(--muted)" stroke-width="1"/>
      <text x="${X(.5)}" y="${H-3}" text-anchor="middle" font-size="9" fill="var(--muted)">${r.w.toFixed(2)} m</text>
      <line x1="${padL-10}" y1="${Y(0)}" x2="${padL-10}" y2="${Y(1)}" stroke="var(--muted)" stroke-width="1"/>
      <text x="${padL-14}" y="${(padT+dd/2).toFixed(1)}" text-anchor="middle" font-size="9" fill="var(--muted)"
        transform="rotate(-90 ${padL-14} ${(padT+dd/2).toFixed(1)})">${r.d.toFixed(2)} m</text></svg>`;
  return s;
}

function openInspector(room,surface,ref){
  if(!MODEL) return;
  SEL={room,surface,ref:ref||null};
  const r=MODEL.rooms.find(x=>x.code===room); if(!r) return;
  const isWall=/^W\d$/.test(surface);
  const w=isWall?MODEL.walls.find(x=>x.room===room&&x.wall===surface):null;
  const sideName={N:"North",E:"East",S:"South",W:"West"};
  inspTitle.textContent=`${room}-${surface}`;
  const pts=MODEL.points.filter(p=>p.room===room&&p.surface===surface);
  const famcol=f=>f==="FACE"||f==="GRID"?"var(--pt-face)":f==="EDGE"||f==="OPENING"?"var(--pt-edge)":
    (f==="SMOKE"||f==="FLOW")?"var(--air)":f==="EMF"?"var(--emf)":"var(--pt-pen)";
  const meta = isWall
    ? `${sideName[w.side]} wall &middot; ${w.len.toFixed(2)} &times; ${w.h.toFixed(2)} m &middot; ${pts.length} points`
    : `${surface==="FLR"?"Floor":"Ceiling"} plane &middot; ${r.w.toFixed(2)} &times; ${r.d.toFixed(2)} m &middot; ${pts.length} points`;
  const drawing=isWall?wallElevationSVG(w):planSVG(r,surface);
  const rows=pts.map(p=>{
    const st=LAYERS.demo?demoStatus(p):(p.status||"To take");
    const sc=LAYERS.demo?`var(${ST_COL[st]||"--pt-skip"})`:famcol(p.fam);
    return `<tr class="${SEL.ref===p.ref?"sel":""}" data-ref="${p.ref}">
    <td><span class="fam" style="background:${sc}"></span>${p.ref}</td>
    <td>${p.fam}</td>
    <td>${p.pos[0].toFixed(2)}, ${p.pos[1].toFixed(2)}, ${p.pos[2].toFixed(2)}</td>
    <td style="color:${sc};white-space:normal">${st==="Further Investigation Required"?"FIR":st}</td></tr>`;}).join("");
  const pulled=PULL&&PULL.room===room&&PULL.wall===surface;
  const pullBtn=isWall?`<button id="pullwall" style="margin:0 0 8px">${pulled?"Return wall to model":"Pull wall out"}</button>`:"";
  inspBody.innerHTML=`<div class="insp-meta">${meta}<br>Full ID prefix: <b>${room}-${surface}-&hellip;</b> &middot; ${LAYERS.demo?"showing demo statuses":"readings not yet captured"}</div>
    ${pullBtn}
    ${drawing}
    <table class="ptable"><tr><th>Point</th><th>Family</th><th>x, y, z (m)</th><th>Status</th></tr>${rows}</table>`;
  insp.classList.add("on");
  inspBody.querySelectorAll("tr[data-ref]").forEach(tr=>{
    tr.addEventListener("click",()=>openInspector(room,surface,tr.dataset.ref));
  });
  const pb=inspBody.querySelector("#pullwall");
  if(pb) pb.addEventListener("click",()=>{
    PULL = (PULL&&PULL.room===room&&PULL.wall===surface) ? null : {room,wall:surface};
    openInspector(room,surface,ref);
  });
  draw();
}
function openSensorCard(sn){
  const r=MODEL.rooms.find(x=>x.code===sn.room);
  const h=k=>hash01(sn.id+k);
  const temp=(18.5+h("t")*3.5), rh=(52+h("r")*24), co2=Math.round(480+h("c")*1700),
        vel=(h("v")*0.22), st=(temp-3.2-h("s")*1.5);
  const risk = rh>70||co2>1800 ? ["Monitor","--st-monitor"] : ["Stable","--st-stable"];
  inspTitle.textContent=`${sn.id} \u00B7 ${sn.room}`;
  const row=(k,v,u)=>`<tr><td style="color:var(--muted)">${k}</td><td style="text-align:right">${v}</td><td style="color:var(--muted)">${u}</td></tr>`;
  inspBody.innerHTML=`
    <div class="insp-meta">${r?r.name:""} \u00B7 logger at room centre, 1.2 m \u00B7 one-minute intervals<br>
    <b style="color:var(--st-fir)">Demo values - no logger is connected.</b></div>
    <table class="ptable" style="font-size:13px">
      ${row("Temperature",temp.toFixed(1),"\u00B0C")}
      ${row("Relative humidity",rh.toFixed(0),"%RH")}
      ${row("CO\u2082",co2,"ppm")}
      ${row("Air velocity",vel<0.005?"0.00":vel.toFixed(2),"m/s")}
      ${row("Nearest surface temp",st.toFixed(1),"\u00B0C")}
    </table>
    <div class="insp-meta" style="margin-top:8px">
      Status: <b style="color:var(${risk[1]})">${risk[0]}</b><br><br>
      The card reads like the report: air first, surfaces second, status last.
      When live data lands, this card is fed by the logger export and the spot
      readings taken in this room - nothing on it is typed by hand.</div>`;
  insp.classList.add("on");
}

function openFrameCard(fr2){
  inspTitle.textContent=`${fr2.id} \u00B7 ${fr2.room}`;

    <div class="insp-meta">${fr2.note}</div>

      In a live job every frame pins to the wall and point it was taken at,
      with the visual pair beside it per the Evidence Frame Standard.</div>`;
  insp.classList.add("on");
}

/* click-to-pick in the 3D view: nearest projected point within 10 px */
let downXY=null;
cv.addEventListener("pointerdown",e=>{ downXY=[e.clientX,e.clientY]; });
cv.addEventListener("pointerup",e=>{
  if(!downXY||!MODEL) return;
  const moved=Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1]); downXY=null;
  if(moved>5) return;
  const rect=cv.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
  // thermal frames first
  if(LAYERS.frames && typeof FRAMES!=="undefined"){
    let bf=null, bfd=14;
    FRAMES.forEach(fr2=>{
      let pos=fr2.pos;
      if(fr2.wall && PULL){ const [rr,ww]=fr2.wall.split("|");
        if(PULL.room===rr&&PULL.wall===ww){ const w=MODEL.walls.find(x=>x.room===rr&&x.wall===ww);
          if(w) pos=[pos[0]+({N:[0,0,-3],S:[0,0,3],E:[3,0,0],W:[-3,0,0]}[w.side][0]),pos[1]+0.2,pos[2]+({N:[0,0,-3],S:[0,0,3],E:[3,0,0],W:[-3,0,0]}[w.side][2])]; } }
      const P=project(pos); const d=Math.hypot(P.x-mx,P.y-my);
      if(d<bfd){ bfd=d; bf=fr2; } });
    if(bf){ openFrameCard(bf); return; }
  }

  // sensors first - bigger glyph, bigger target
  if(LAYERS.sensors && MODEL.sensors){
    let bs=null, bsd=16;
    MODEL.sensors.forEach(sn=>{ const P=project(sn.pos);
      const d=Math.hypot(P.x-mx,P.y-my); if(d<bsd){ bsd=d; bs=sn; } });
    if(bs){ openSensorCard(bs); return; }
  }
  let best=null,bd=12;
  MODEL.points.forEach(p=>{
    if(!LAYERS.ceiling && p.surface==="CEIL") return;
    const P=project(p.pos); const d=Math.hypot(P.x-mx,P.y-my);
    if(d<bd){ bd=d; best=p; }
  });
  if(best) openInspector(best.room,best.surface,best.ref);
});

/* ---------- AUTO-ROTATE ---------------------------------------------------- */
let ROT={on:false, raf:null, last:0, speed:0.10}; // radians per second - slow and smooth
function rotStep(ts){
  if(!ROT.on) return;
  if(ROT.last){ const dt=Math.min(0.1,(ts-ROT.last)/1000);
    if(!dragging){ cam.yaw+=ROT.speed*dt; draw(); } }
  ROT.last=ts;
  ROT.raf=requestAnimationFrame(rotStep);
}
$("rotate").onclick=function(){
  ROT.on=!ROT.on; this.setAttribute("aria-pressed",ROT.on);
  if(ROT.on){ ROT.last=0; ROT.raf=requestAnimationFrame(rotStep); }
  else if(ROT.raf){ cancelAnimationFrame(ROT.raf); ROT.raf=null; }
};
// keyboard nudge: [ and ] change speed, r toggles
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA"||e.target.isContentEditable) return;
  if(e.key==="r"){ $("rotate").click(); }
  if(e.key==="["){ ROT.speed=Math.max(0.02,ROT.speed-0.03); }
  if(e.key==="]"){ ROT.speed=Math.min(0.6,ROT.speed+0.03); }
});

/* KIOSK MODE: auto-rotate, dark theme, seven phases, no controls */
(function(){
  document.documentElement.setAttribute("data-theme","light"); PULL=null; ctx.fillText=function(){}; ctx.strokeText=function(){};
  const isWallPt=p=>p.surface!=="FLR"&&p.surface!=="CEIL"&&p.ext!==false&&p.fam!=="SMOKE"&&p.fam!=="FLOW"&&p.fam!=="EMF";
  const P=[
    {c:"The external envelope, measured: every external wall",L:{floor:1,walls:1,points:1},pf:isWallPt},
    {c:"A sensor in every room",L:{floor:1,walls:1,intwalls:1,sensors:1}},
    {c:"Thermal scans of every external wall",L:{floor:1,walls:1},heat:1},
    {c:"Your Home State record: every reading in its place",L:{floor:1,walls:1,intwalls:1,points:1,sensors:1},heat:1}
  ];
  let KP=0;
  const origDraw=draw;
  function heatWalls(){ if(!MODEL||cam.planMode) return; MODEL.walls.forEach((w,wi)=>{ if(!w.ext) return; const f=w.frame; const nx=Math.max(3,Math.round(f.len*1.2)), ny=3;
    for(let a=0;a<nx;a++) for(let b=0;b<ny;b++){ const a0=a/nx,a1=(a+1)/nx,b0=b/ny,b1=(b+1)/ny;
      const t=0.5+0.5*Math.sin(a*1.7+b*0.9+wi*2.1); const warm=t>0.62, cool=t<0.3;
      const col=warm?"rgba(232,134,90,.42)":cool?"rgba(111,163,201,.34)":"rgba(200,190,175,.10)";
      poly([at(f,a0,b0),at(f,a1,b0),at(f,a1,b1),at(f,a0,b1)],col,"rgba(255,255,255,.06)",0.4); } }); }
  draw=function(){ const all=MODEL?MODEL.points:null; if(all&&P[KP].pf) MODEL.points=all.filter(P[KP].pf); origDraw(); if(all) MODEL.points=all; if(P[KP].heat) heatWalls(); };

  const cap=document.getElementById("kcaptext"),dots=document.getElementById("kdots");
  P.forEach(()=>dots.appendChild(document.createElement("i")));
  function show(n){ KP=n;
    Object.keys(LAYERS).forEach(k=>{LAYERS[k]=!!P[n].L[k]});
    document.querySelectorAll("#rail button[data-layer]").forEach(b=>b.setAttribute("aria-pressed",LAYERS[b.dataset.layer]));
    draw(); cap.textContent=P[n].c;
    Array.prototype.forEach.call(dots.children,(d,k)=>d.className=k===n?"on":"");
    try{ window.parent.postMessage({jbphase:n},"*"); }catch(e){}
  }
  const q=new URLSearchParams(location.search);
  const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let i=0;
  function fitK(){ $("fit").click(); cam.dist*=0.62; cam.pitch=-1.05; cam.cy=1.4; draw(); }
  fitK(); show(0);
  window.addEventListener("resize",fitK);
  setTimeout(function(){ fitK(); if(!reduced){ ROT.speed=0.06; if(!ROT.on) $("rotate").click(); setInterval(()=>{i=(i+1)%P.length; show(i)},2600); } else show(3); },80);
})();
